name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv pip install -r requirements.txt --system
      - name: Lint (ruff)
        run: ruff check api scripts
      - name: Types (mypy)
        run: mypy api
      - name: Tests (offline; live marker deselected)
        run: pytest -q
        env:
          ARXIV_OFFLINE: "1"
